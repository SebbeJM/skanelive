// Bara fordon inom (en marginal runt) det synliga kartutsnittet får en
// markör alls — precis som SL Live gör. Sparar massor av DOM-element
// och CSS-animationer när man är inzoomad på en liten del av Skåne.
// Marginalen (50 %) gör att fordon strax utanför skärmkanten ändå
// redan finns där, så inget dyker upp abrupt exakt vid kanten.
const RENDER_BOUNDS_PADDING = 0.5;
function isWithinRenderBounds(bounds, lat, lon) {
  return bounds.contains([lat, lon]);
}

function updateVehicles(entities) {
  // Räkna ut kartans synliga gränser EN gång per genomgång, inte en
  // gång per fordon — sparar en hel del arbete när det finns hundratals
  // fordon i datan.
  const renderBounds = map.getBounds().pad(RENDER_BOUNDS_PADDING);
  const seenIds = new Set();
  for (const entity of entities) {
    const vp = entity.vehicle;
    if (!vp || !vp.position) continue;
    const id = (vp.vehicle && (vp.vehicle.id || vp.vehicle.label)) || entity.id;
    const lat = vp.position.latitude;
    const lon = vp.position.longitude;

    // Utanför synfältet (och inte den vi just nu följer)? Rita ingen
    // markör, och ta bort en eventuell befintlig som panorerat/zoomat
    // ut ur bilden. INTE medan man aktivt drar i kartan — annars kunde
    // ett fordon tas bort och sedan skapas HELT FRÄSCH (utan någon
    // startposition att glida ifrån) så fort dragningen avslutades,
    // vilket gav en "stannar-flyger-pausar"-känsla.
    if (id !== followedId && !isWithinRenderBounds(renderBounds, lat, lon)) {
      if (!isDragging && markers.has(id)) {
        const entry = markers.get(id);
        map.removeLayer(entry.marker);
        map.closePopup(entry.popup);
        markers.delete(id);
      } else if (markers.has(id)) {
        // Finns redan en markör men den är utanför synfältet just nu
        // (eller vi drar aktivt) — räkna den ändå som "sedd" så den
        // inte råkar tas bort av städningslogiken i onödan.
        seenIds.add(id);
      }
      continue;
    }
    const tripId = vp.trip && vp.trip.tripId ? vp.trip.tripId : "";
    const tripInfo = tripInfoByTripId.get(tripId);
    const displayName = (tripInfo && tripInfo.line) || tripId || "okänd";
    const isMoving = vp.position.speed != null && vp.position.speed > 0.5;
    if (staticDataLoaded && displayName === "okänd") {
      continue;
    }
    seenIds.add(id);
    const destination = (tripInfo && tripInfo.destination) || "";
    const speed = vp.position.speed;
    const lineColor = (tripInfo && tripInfo.color) ? `#${tripInfo.color}` : "inherit";
    const popupHtml = `
      <div class="popup-content">
        <b style="color: ${lineColor};">${lineLabelFor(tripInfo, displayName)}</b>
        ${destination ? `På väg mot: ${destination}<br>` : ""}
        Hastighet: ${speed != null ? Math.round(speed * 3.6) + " km/h" : "okänd"}
      </div>
    `;
    const iconKey = `${(tripInfo && tripInfo.color) || ""}|${displayName}|${shouldShowLabels()}|${isMoving}`;
    if (markers.has(id)) {
      const entry = markers.get(id);
      if (entry.iconKey !== iconKey) {
        entry.marker.setIcon(makeDivIcon(tripInfo, isMoving));
        entry.iconKey = iconKey;
      }
      entry.tripInfo = tripInfo;
      entry.missedPolls = 0;
      entry.moving = isMoving;
      entry.lastSpeed = speed;
      const now = Date.now();
      const elapsed = entry.lastUpdateTime ? now - entry.lastUpdateTime : POLL_INTERVAL_MS;
      const clamped = Math.max(1000, Math.min(elapsed, POLL_INTERVAL_MS * 2));
      const el = entry.marker.getElement();
      if (el) el.style.transitionDuration = `${clamped}ms`;
      entry.lastUpdateTime = now;
      entry.popupBaseHtml = popupHtml;
      entry.id = id;
      if (map.hasLayer(entry.popup)) animatePopupTo(entry.popup, lat, lon, clamped);
      entry.marker.setLatLng([lat, lon]);
      if (followedId !== id) {
        entry.popup.setContent(renderPopupHtml(popupHtml, entry.pinned, id));
      }
      if (followedId === id) {
        updateFollowHud(entry);
        beginProgrammaticCameraMove(clamped);
        // Samma glidningstid som ikonens egen CSS-glidning (clamped) —
        // annars hinner kameran ikapp på sina fasta 2,8 sekunder och
        // sedan STÅR STILL och väntar tills nästa hämtning, medan
        // ikonen fortsätter glida mjukt hela vägen. Det gav den
        // "hackiga" känslan.
        map.panTo(getFollowTargetLatLng(L.latLng(lat, lon), map.getZoom()), {
          animate: true,
          duration: clamped / 1000,
          easeLinearity: 1, // linjär, matchar ikonens egen linjära CSS-glidning
          noMoveStart: true
        });
      }
    } else {
      const marker = L.marker([lat, lon], { icon: makeDivIcon(tripInfo, isMoving) }).addTo(map);
      const popup = L.popup({ offset: [0, -14], closeButton: false, autoClose: false, closeOnClick: false, autoPan: false })
        .setContent(popupHtml);
      const newEntry = {
        marker, popup, iconKey, tripInfo, moving: isMoving,
        lastUpdateTime: Date.now(), pinned: false, popupBaseHtml: popupHtml,
        id: id, lastSpeed: speed
      };
      markers.set(id, newEntry);
      marker.on("mouseover", () => {
        if (followedId === id) return;
        popup.setLatLng(marker.getLatLng());
        popup.openOn(map);
      });
      marker.on("mouseout", () => {
        if (!newEntry.pinned) map.closePopup(popup);
      });
      marker.on("click", (e) => {
        L.DomEvent.stopPropagation(e);
        if (followedId === id) return;
        newEntry.pinned = !newEntry.pinned;
        // Linjen visas nu automatiskt så fort man klickar ett fordon
        // (ersätter en eventuellt redan visad linje, precis som
        // showLineForRoute redan gör) — och döljs igen om man
        // avmarkerar fordonet.
        if (newEntry.pinned) {
          showLineForRoute(newEntry.tripInfo);
        } else if (currentRouteId === (newEntry.tripInfo && newEntry.tripInfo.routeId)) {
          hideLine();
        }
        popup.setContent(renderPopupHtml(newEntry.popupBaseHtml, newEntry.pinned, id));
        if (newEntry.pinned) {
          popup.setLatLng(marker.getLatLng());
          popup.openOn(map);
        } else {
          map.closePopup(popup);
        }
      });
    }
  }
  for (const [id, entry] of markers.entries()) {
    if (!seenIds.has(id)) {
      // Ta inte bort ett fordon direkt bara för att det saknades i EN enda
      // hämtningsomgång — Trafiklabs data kan ha korta, tillfälliga luckor
      // som inte betyder att fordonet faktiskt slutat köra. Vänta tills
      // det saknats flera gånger i rad, annars kunde följningen (och
      // vanliga markörer) försvinna helt i onödan.
      entry.missedPolls = (entry.missedPolls || 0) + 1;
      if (entry.missedPolls < 3) continue;
      if (followedId === id) stopFollow();
      map.removeLayer(entry.marker);
      map.closePopup(entry.popup);
      markers.delete(id);
    }
  }
}
let FeedMessageType = null;
async function loadProtoSchema() {
  const root = protobuf.parse(GTFS_RT_PROTO).root;
  FeedMessageType = root.lookupType("transit_realtime.FeedMessage");
}
async function loadRouteColors() {
  // Kärndatan (linjefärger, tåglinjer, tågstationer) laddas alltid,
  // oavsett om NÅGON annan enskild fil (t.ex. den nyare bus_stops.json)
  // råkar saknas — annars stoppar ETT saknat fil-fel allt annat också.
  try {
    const [tripLookupRes, railLinesRes, stationsRes] = await Promise.all([
      fetch(TRIP_LOOKUP_URL, { cache: "no-store" }),
      fetch(RAIL_LINES_URL, { cache: "no-store" }),
      fetch(TRAIN_STATIONS_URL, { cache: "no-store" }),
    ]);
    if (!tripLookupRes.ok) throw new Error(`trip_lookup.json: HTTP ${tripLookupRes.status}`);
    if (!railLinesRes.ok) throw new Error(`rail_lines.json: HTTP ${railLinesRes.status}`);
    if (!stationsRes.ok) throw new Error(`train_stations.json: HTTP ${stationsRes.status}`);
    const tripLookup = await tripLookupRes.json();
    const railLinesData = await railLinesRes.json();
    const stationsData = await stationsRes.json();
    for (const [tripId, info] of Object.entries(tripLookup.trips)) {
      tripInfoByTripId.set(tripId, info);
    }
    console.log(`Laddade uppslagstabell för ${tripInfoByTripId.size} resor (byggd ${tripLookup.builtAt})`);
    drawAllRailLines(railLinesData.lines);
    console.log(`Ritade ${railLinesData.lines.length} tåglinjer`);
    drawRealTrainStations(stationsData.stations);
    // TILLFÄLLIGT AVSTÄNGD (2026-09-14): route_shapes.json innehåller
    // fortfarande felaktiga raka "genvägs"-sträckor för vissa linjer
    // (syns som spikraka streck tvärs över kartan) — stäng av
    // uppritningen helt tills byggjobbet körts om med den förbättrade
    // kvalitetskontrollen OCH det verifierats se rätt ut, istället för
    // att visa detta för besökare under tiden.
    // await drawAllMutedLines();
  } catch (err) {
    console.warn("Kunde inte ladda den servergenererade linjedatan:", err);
  }

  // Busshållplatserna hämtas separat — om den filen saknas (t.ex. innan
  // byggjobbet körts första gången) ska det bara ge tomma hållplatser,
  // inte krascha resten av sidan.
  try {
    const busStopsRes = await fetch(BUS_STOPS_URL, { cache: "no-store" });
    if (!busStopsRes.ok) throw new Error(`bus_stops.json: HTTP ${busStopsRes.status}`);
    const busStopsData = await busStopsRes.json();
    allBusStops = busStopsData.stops;
    console.log(`Laddade ${allBusStops.length} busshållplatser`);
    renderVisibleBusStops();
  } catch (err) {
    console.warn("Kunde inte ladda busshållplatser (finns filen ännu inte?):", err);
  }

  // Öresundståg-tidtabellen, för simuleringen (se längre ner) — separat
  // try/catch av samma anledning som busshållplatserna ovan.
  try {
    const scheduleRes = await fetch(ORESUNDSTAG_SCHEDULE_URL, { cache: "no-store" });
    if (!scheduleRes.ok) throw new Error(`oresundstag_schedule.json: HTTP ${scheduleRes.status}`);
    const scheduleData = await scheduleRes.json();
    oresundstagSchedule = scheduleData.trips;
    oresundstagShapesById = scheduleData.shapes || {};
    console.log(`Laddade Öresundståg-tidtabell: ${oresundstagSchedule.length} resor, ${Object.keys(oresundstagShapesById).length} sträckgeometrier`);
    oresundstagAnimationLoop();
  } catch (err) {
    console.warn("Kunde inte ladda Öresundståg-tidtabellen (finns filen ännu inte?):", err);
  }
}
async function fetchVehiclePositions() {
  const res = await fetch(PROXY_URL, { cache: "no-store" });
  if (!res.ok) throw new Error(`HTTP ${res.status}`);
  const buffer = new Uint8Array(await res.arrayBuffer());
  const message = FeedMessageType.decode(buffer);
  const obj = FeedMessageType.toObject(message, { defaults: true });
  return obj.entity || [];
}
let firstPollLogged = false;
let lastEntities = null;
async function pollLoop() {
  const isFirst = !firstPollLogged;
  try {
    const entities = await fetchVehiclePositions();
    lastEntities = entities;
    updateVehicles(entities);
    const count = markers.size;
    setStatus("live", `live · ${count} fordon · uppdaterad ${new Date().toLocaleTimeString("sv-SE")}`);
    if (isFirst) {
      firstPollLogged = true;
      console.timeEnd("⏱ TOTALT: skriptstart → första fordonet synligt");
    }
  } catch (err) {
    console.error(err);
    setStatus("error", `kunde inte hämta data (${err.message})`);
  } finally {
    setTimeout(pollLoop, POLL_INTERVAL_MS);
  }
}
const TRAIN_ICON_SVG = `
  <svg viewBox="0 0 24 24" width="13" height="13">
    <rect x="5" y="3" width="14" height="14" rx="4" fill="currentColor"/>
    <rect x="7.5" y="6" width="9" height="5" rx="1" fill="#0a0a0a"/>
    <rect x="6" y="15.5" width="12" height="2.2" fill="currentColor"/>
    <circle cx="8.5" cy="19" r="1.8" fill="currentColor"/>
    <circle cx="15.5" cy="19" r="1.8" fill="currentColor"/>
  </svg>
`;
const trainStationMarkers = new Map();
const trainStationsLayer = L.layerGroup().addTo(map);
function drawRealTrainStations(stations) {
  for (const s of stations) {
    if (!s.name) continue;
    const icon = L.divIcon({
      className: "train-station-marker",
      html: `<div class="train-station-icon">${TRAIN_ICON_SVG}</div>`,
      iconSize: [20, 20],
      iconAnchor: [10, 10],
    });
    const marker = L.marker([s.lat, s.lon], { icon }).addTo(trainStationsLayer);
    marker.bindTooltip(`${s.name}<br><span style="opacity:0.75;font-size:0.85em;">Tryck för att se tidtabell</span>`, { direction: "top", offset: [0, -12] });
    marker.on("click", () => openDepartureBoardPanel(s.name, s.lat, s.lon));
    trainStationMarkers.set(s.name, { marker });
  }
  console.log(`Ritade ${trainStationMarkers.size} riktiga tågstationer från Trafiklabs data`);
}
const STATION_EXT_IDS = {
};
window.lookupStationId = async function (name) {
  const res = await fetch(`${PROXY_URL}/resrobot/stops?name=${encodeURIComponent(name)}`, { cache: "no-store" });
  if (!res.ok) {
    console.error(`Fel vid sökning: HTTP ${res.status}`);
    return;
  }
  const data = await res.json();
  const hits = data.stopLocationOrCoordLocation || [];
  console.log(
    `Träffar för "${name}":`,
    hits.map((h) => {
      const s = h.StopLocation || h.CoordLocation || {};
      return { name: s.name, extId: s.extId, lat: s.lat, lon: s.lon };
    })
  );
};
function formatDeparture(dep) {
  const line = (dep.Product && (dep.Product.num || dep.Product.name)) || dep.transportNumber || "?";
  const dir = dep.direction || (dep.Stops && "") || "";
  const time = dep.rtTime || dep.time || "?";
  const delayed = Boolean(dep.rtTime && dep.time && dep.rtTime !== dep.time);
  return `${line} → ${dir}: ${time}${delayed ? " (försenad)" : ""}`;
}
async function updateResRobotDepartures() {
  for (const [stationName, extId] of Object.entries(STATION_EXT_IDS)) {
    if (!extId) continue;
    const entry = trainStationMarkers.get(stationName);
    if (!entry) continue;
    try {
      const res = await fetch(`${PROXY_URL}/resrobot/departures?id=${encodeURIComponent(extId)}`, { cache: "no-store" });
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const data = await res.json();
      const departures = (data.Departure || []).slice(0, 4);
      const list = departures.length
        ? departures.map((d) => `<div>${formatDeparture(d)}</div>`).join("")
        : "<div>Inga avgångar just nu</div>";
      entry.popup.setContent(`<div class="popup-content"><b>${stationName}</b>${list}</div>`);
    } catch (err) {
      console.warn(`Kunde inte hämta avgångar för ${stationName}:`, err.message);
    }
    await new Promise((r) => setTimeout(r, 300));
  }
}
async function loadVisitorStats() {
  const todayEl = document.getElementById("visitors-today");
  const monthEl = document.getElementById("visitors-month");
  if (!todayEl || !monthEl) return;
  try {
    const res = await fetch(`${PROXY_URL}/counter`, { cache: "no-store" });
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const data = await res.json();
    todayEl.textContent = data.today == null ? "–" : data.today.toLocaleString("sv-SE");
    monthEl.textContent = data.month == null ? "–" : data.month.toLocaleString("sv-SE");
  } catch (err) {
    console.warn("Kunde inte hämta besökssiffror:", err.message);
    todayEl.textContent = "–";
    monthEl.textContent = "–";
  }
}
(async function init() {
  console.time("⏱ init() start → loadProtoSchema klar");
  await loadProtoSchema();
  console.timeEnd("⏱ init() start → loadProtoSchema klar");
  pollLoop();
  loadVisitorStats();
  loadRouteColors().then(() => {
    staticDataLoaded = true;
    if (lastEntities) updateVehicles(lastEntities);
    if (Object.values(STATION_EXT_IDS).some(Boolean)) {
      updateResRobotDepartures();
      setInterval(updateResRobotDepartures, 90000);
    }
  });
})();
