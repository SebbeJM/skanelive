<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kontakt – Skåne Live</title>
<style>
  :root {
    --bg: #0e0e0e;
    --fg: #e7ece8;
    --muted: #7d9088;
    --line: #262626;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    background: var(--bg);
    color: var(--fg);
    font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
    overflow: hidden;
  }
  body {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 1.5rem;
  }

  /* ============================================================
     Dekorativ bakgrund — en simulerad "mini-karta" inzoomad på
     Malmö, med några fordon som rör sig i loop. Helt påhittat för
     syns skull, ingen riktig data eller API-anrop inblandat.
     ============================================================ */
  #bg-map {
    position: absolute;
    inset: 0;
    overflow: hidden;
    z-index: 0;
  }
  #bg-map svg#bg-streets {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
  }
  #bg-map svg#bg-streets path {
    fill: none;
    stroke: #262626;
    stroke-width: 0.6;
  }
  #bg-map svg#bg-streets .bg-water {
    fill: #171b1e;
    stroke: none;
  }
  .bg-dot {
    position: absolute;
    width: 7px;
    height: 7px;
    border-radius: 50%;
    box-shadow: 0 0 4px rgba(0,0,0,0.6);
  }
  .bg-dot.green  { background: #2e7d32; }
  .bg-dot.yellow { background: #f9a825; }
  .bg-dot.purple { background: #645fa2; }

  @keyframes bgRoute1 {
    0%   { left: 4%;  top: 78%; }
    25%  { left: 30%; top: 60%; }
    50%  { left: 55%; top: 68%; }
    75%  { left: 78%; top: 45%; }
    100% { left: 4%;  top: 78%; }
  }
  @keyframes bgRoute2 {
    0%   { left: 92%; top: 20%; }
    30%  { left: 65%; top: 35%; }
    60%  { left: 40%; top: 20%; }
    100% { left: 92%; top: 20%; }
  }
  @keyframes bgRoute3 {
    0%   { left: 15%; top: 12%; }
    40%  { left: 20%; top: 50%; }
    70%  { left: 12%; top: 82%; }
    100% { left: 15%; top: 12%; }
  }
  @keyframes bgRoute4 {
    0%   { left: 85%; top: 88%; }
    35%  { left: 60%; top: 70%; }
    65%  { left: 62%; top: 30%; }
    100% { left: 85%; top: 88%; }
  }

  #bg-map .bg-dot:nth-child(1) { animation: bgRoute1 22s linear infinite; }
  #bg-map .bg-dot:nth-child(2) { animation: bgRoute2 18s linear infinite; animation-delay: -4s; }
  #bg-map .bg-dot:nth-child(3) { animation: bgRoute3 26s linear infinite; animation-delay: -11s; }
  #bg-map .bg-dot:nth-child(4) { animation: bgRoute4 20s linear infinite; animation-delay: -7s; }
  #bg-map .bg-dot:nth-child(5) { animation: bgRoute1 22s linear infinite; animation-delay: -15s; }
  #bg-map .bg-dot:nth-child(6) { animation: bgRoute2 18s linear infinite; animation-delay: -9s; }

  /* Mörk vinjett ovanpå bakgrunden så kontaktrutan alltid är lätt att läsa. */
  #bg-vignette {
    position: absolute;
    inset: 0;
    z-index: 1;
    background: radial-gradient(circle at center, rgba(14,14,14,0.35) 0%, rgba(14,14,14,0.88) 62%, rgba(14,14,14,0.97) 100%);
  }

  .contact-box {
    position: relative;
    z-index: 2;
  }
  .contact-box p {
    margin: 0 0 0.5rem;
    line-height: 1.6;
    color: var(--muted);
  }
  .email-row {
    display: inline-flex;
    align-items: center;
    gap: 0.6rem;
    font-size: 1.1rem;
    font-weight: 600;
    color: var(--fg);
  }
  #copy-btn {
    background: none;
    border: 1px solid var(--line);
    border-radius: 5px;
    padding: 0.35rem;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    color: var(--fg);
  }
  #copy-btn:hover {
    border-color: var(--muted);
  }
  #copy-feedback {
    display: block;
    margin-top: 0.7rem;
    font-size: 0.8rem;
    color: var(--muted);
    height: 1.2em;
    opacity: 0;
    transition: opacity 0.2s ease;
  }
  #copy-feedback.visible {
    opacity: 1;
  }
  .back-link {
    display: inline-block;
    margin-top: 2rem;
    color: var(--muted);
    text-decoration: none;
    font-size: 0.85rem;
  }
  .back-link:hover {
    color: var(--fg);
  }
</style>
</head>
<body>
  <div id="bg-map" aria-hidden="true">
    <svg id="bg-streets" viewBox="0 0 100 100" preserveAspectRatio="none">
      <!-- Löst inspirerat av Malmös gatunät (Öresund i hörnet, någon
           diagonal huvudled, ett rutnät i övrigt) — inte en exakt karta. -->
      <path class="bg-water" d="M0,0 L18,0 L8,16 L0,10 Z" />
      <path d="M0,10 C 20,20 40,15 60,25 S 90,20 100,30" />
      <path d="M0,35 C 25,40 45,32 70,42 S 95,45 100,50" />
      <path d="M0,60 C 20,55 50,68 75,58 S 95,65 100,62" />
      <path d="M0,85 C 30,80 55,90 100,82" />
      <path d="M10,0 C 15,25 5,55 18,100" />
      <path d="M35,0 C 30,30 40,60 32,100" />
      <path d="M58,0 C 63,25 55,55 65,100" />
      <path d="M82,0 C 78,30 88,60 80,100" />
    </svg>
    <div class="bg-dot green"></div>
    <div class="bg-dot yellow"></div>
    <div class="bg-dot purple"></div>
    <div class="bg-dot green"></div>
    <div class="bg-dot yellow"></div>
    <div class="bg-dot purple"></div>
  </div>
  <div id="bg-vignette" aria-hidden="true"></div>

  <div class="contact-box">
    <p>För kontakt använd min mejl</p>
    <div class="email-row">
      <span id="email-text">sebastianmauritsson@gmail.com</span>
      <button id="copy-btn" aria-label="Kopiera mejladress" title="Kopiera">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="9" y="9" width="12" height="12" rx="2"></rect>
          <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
        </svg>
      </button>
    </div>
    <span id="copy-feedback">Kopierat!</span>
    <br>
    <a class="back-link" href="index.html">← Tillbaka till kartan</a>
  </div>

<script>
  const copyBtn = document.getElementById("copy-btn");
  const feedback = document.getElementById("copy-feedback");
  const email = document.getElementById("email-text").textContent;

  copyBtn.addEventListener("click", async () => {
    try {
      await navigator.clipboard.writeText(email);
    } catch (err) {
      // Reservlösning för äldre webbläsare utan Clipboard API
      const ta = document.createElement("textarea");
      ta.value = email;
      document.body.appendChild(ta);
      ta.select();
      document.execCommand("copy");
      document.body.removeChild(ta);
    }
    feedback.classList.add("visible");
    setTimeout(() => feedback.classList.remove("visible"), 1500);
  });
</script>
</body>
</html>
