<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kontakt – Skåne Live</title>
<style>
  :root {
    --bg: #0e0e0e;
    --fg: #e7ece8;
    --muted: #7d9088;
    --line: #262626;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    background: var(--bg);
    color: var(--fg);
    font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
  }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 1.5rem;
  }
  .contact-box p {
    margin: 0 0 0.5rem;
    line-height: 1.6;
    color: var(--muted);
  }
  .email-row {
    display: inline-flex;
    align-items: center;
    gap: 0.6rem;
    font-size: 1.1rem;
    font-weight: 600;
    color: var(--fg);
  }
  #copy-btn {
    background: none;
    border: 1px solid var(--line);
    border-radius: 5px;
    padding: 0.35rem;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    color: var(--fg);
  }
  #copy-btn:hover {
    border-color: var(--muted);
  }
  #copy-feedback {
    display: block;
    margin-top: 0.7rem;
    font-size: 0.8rem;
    color: var(--muted);
    height: 1.2em;
    opacity: 0;
    transition: opacity 0.2s ease;
  }
  #copy-feedback.visible {
    opacity: 1;
  }
  .back-link {
    display: inline-block;
    margin-top: 2rem;
    color: var(--muted);
    text-decoration: none;
    font-size: 0.85rem;
  }
  .back-link:hover {
    color: var(--fg);
  }
</style>
</head>
<body>
  <div class="contact-box">
    <p>För kontakt använd min mejl</p>
    <div class="email-row">
      <span id="email-text">sebastianmauritsson@gmail.com</span>
      <button id="copy-btn" aria-label="Kopiera mejladress" title="Kopiera">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="9" y="9" width="12" height="12" rx="2"></rect>
          <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
        </svg>
      </button>
    </div>
    <span id="copy-feedback">Kopierat!</span>
    <br>
    <a class="back-link" href="index.html">← Tillbaka till kartan</a>
  </div>

<script>
  const copyBtn = document.getElementById("copy-btn");
  const feedback = document.getElementById("copy-feedback");
  const email = document.getElementById("email-text").textContent;

  copyBtn.addEventListener("click", async () => {
    try {
      await navigator.clipboard.writeText(email);
    } catch (err) {
      // Reservlösning för äldre webbläsare utan Clipboard API
      const ta = document.createElement("textarea");
      ta.value = email;
      document.body.appendChild(ta);
      ta.select();
      document.execCommand("copy");
      document.body.removeChild(ta);
    }
    feedback.classList.add("visible");
    setTimeout(() => feedback.classList.remove("visible"), 1500);
  });
</script>
</body>
</html>
