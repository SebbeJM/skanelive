<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kontakt – Skåne Live</title>
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" />
<style>
  :root {
    --bg: #0e0e0e;
    --panel: #10161c;
    --fg: #e7ece8;
    --muted: #7d9088;
    --line: #262626;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    background: var(--bg);
    color: var(--fg);
    font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
    overflow: hidden;
  }
  body {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 1.5rem;
  }

  /* ============================================================
     Bakgrund — en RIKTIG karta (samma OpenFreeMap-stil och mörka
     tema som huvudsidan), inzoomad på Malmö. Helt icke-interaktiv
     (går inte att panorera/zooma/klicka), och fordonen är simulerade
     — ingen GPS eller API-anrop laddas, bara för syns skull.
     ============================================================ */
  #bg-map {
    position: absolute;
    inset: 0;
    z-index: 0;
    pointer-events: none;
  }

  /* Samma fordonsikon-utseende som på huvudsidan, pixel för pixel. */
  .vehicle-marker {
    transition: transform 6.5s linear;
    will-change: transform;
  }
  .vehicle-icon {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 22px;
    height: 22px;
    border-radius: 50%;
    background: var(--panel);
    box-shadow: 0 1px 4px rgba(0,0,0,0.6);
    color: var(--fg);
    font-size: 10px;
    font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
    font-weight: 600;
  }
  .vehicle-icon .label {
    text-shadow:
      -1px -1px 0 #000,
       1px -1px 0 #000,
      -1px  1px 0 #000,
       1px  1px 0 #000;
  }

  /* Mörk vinjett ovanpå kartan så kontaktrutan alltid är lätt att läsa. */
  #bg-vignette {
    position: absolute;
    inset: 0;
    z-index: 1;
    pointer-events: none;
    background: radial-gradient(circle at center, rgba(14,14,14,0.2) 0%, rgba(14,14,14,0.55) 62%, rgba(14,14,14,0.75) 100%);
  }

  .contact-box {
    position: relative;
    z-index: 2;
  }
  .contact-box p {
    margin: 0 0 0.5rem;
    line-height: 1.6;
    color: var(--muted);
  }
  .email-row {
    display: inline-flex;
    align-items: center;
    gap: 0.6rem;
    font-size: 1.1rem;
    font-weight: 600;
    color: var(--fg);
  }
  #copy-btn {
    background: none;
    border: 1px solid var(--line);
    border-radius: 5px;
    padding: 0.35rem;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    color: var(--fg);
  }
  #copy-btn:hover {
    border-color: var(--muted);
  }
  #copy-feedback {
    display: block;
    margin-top: 0.7rem;
    font-size: 0.8rem;
    color: var(--muted);
    height: 1.2em;
    opacity: 0;
    transition: opacity 0.2s ease;
  }
  #copy-feedback.visible {
    opacity: 1;
  }
  .back-link {
    display: inline-block;
    margin-top: 2rem;
    color: var(--muted);
    text-decoration: none;
    font-size: 0.85rem;
  }
  .back-link:hover {
    color: var(--fg);
  }
</style>
</head>
<body>
  <div id="bg-map" aria-hidden="true"></div>
  <div id="bg-vignette" aria-hidden="true"></div>

  <div class="contact-box">
    <p>För kontakt använd min mejl</p>
    <div class="email-row">
      <span id="email-text">sebastianmauritsson@gmail.com</span>
      <button id="copy-btn" aria-label="Kopiera mejladress" title="Kopiera">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="9" y="9" width="12" height="12" rx="2"></rect>
          <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
        </svg>
      </button>
    </div>
    <span id="copy-feedback">Kopierat!</span>
    <br>
    <a class="back-link" href="index.html">← Tillbaka till kartan</a>
  </div>

<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script>
  // ============================================================
  // Kopiera-knapp
  // ============================================================
  const copyBtn = document.getElementById("copy-btn");
  const feedback = document.getElementById("copy-feedback");
  const email = document.getElementById("email-text").textContent;

  copyBtn.addEventListener("click", async () => {
    try {
      await navigator.clipboard.writeText(email);
    } catch (err) {
      const ta = document.createElement("textarea");
      ta.value = email;
      document.body.appendChild(ta);
      ta.select();
      document.execCommand("copy");
      document.body.removeChild(ta);
    }
    feedback.classList.add("visible");
    setTimeout(() => feedback.classList.remove("visible"), 1500);
  });

  // ============================================================
  // Bakgrundskarta — Malmö centrum, samma stil/tema som huvudsidan
  // ============================================================
  const map = new maplibregl.Map({
    container: "bg-map",
    style: "https://tiles.openfreemap.org/styles/liberty",
    center: [13.0130, 55.5935], // Möllevången-området — tätt gatunät, inga tågspår i närheten
    zoom: 16.5,
    attributionControl: false,
    interactive: false, // helt icke-interaktiv — bara dekoration
  });

  // ---- Samma mörkläggningslogik som huvudsidans applyDarkTheme() ----
  const LAYERS_TO_REMOVE = [
    "building-3d",
    "aeroway_fill", "aeroway_runway", "aeroway_taxiway",
    "boundary_3", "boundary_2", "boundary_disputed",
    "waterway_line_label", "water_name_point_label", "water_name_line_label",
    "poi_r20", "poi_r7", "poi_r1",
    "highway-name-path", "highway-name-minor", "highway-name-major",
    "highway-shield-non-us", "highway-shield-us-interstate", "road_shield_us",
    "road_one_way_arrow", "road_one_way_arrow_opposite",
    "label_other", "label_village", "label_state",
    "label_country_3", "label_country_2", "label_country_1",
    "poi_transit", "airport", // ingen anledning att visa hållplatser här
  ];

  function removeUnneededLayers() {
    for (const id of LAYERS_TO_REMOVE) {
      if (map.getLayer(id)) map.removeLayer(id);
    }
  }

  function applyDarkTheme() {
    const style = map.getStyle();
    for (const layer of style.layers) {
      const id = layer.id;
      const type = layer.type;
      try {
        if (type === "background") {
          map.setPaintProperty(id, "background-color", "#0e0e0e");
        } else if (type === "raster") {
          map.setPaintProperty(id, "raster-opacity", 0);
        } else if (id === "building") {
          map.setPaintProperty(id, "fill-color", "#000000");
          map.setPaintProperty(id, "fill-outline-color", "#000000");
          map.setLayerZoomRange(id, 13, 24);
        } else if (id === "building-3d") {
          // borttaget nedan
        } else if (type === "fill") {
          let fillColor;
          if (id.includes("water")) {
            fillColor = "#2c353c";
          } else {
            fillColor = "#0e0e0e";
          }
          map.setPaintProperty(id, "fill-color", fillColor);
          if (layer.paint && layer.paint["fill-outline-color"] !== undefined) {
            map.setPaintProperty(id, "fill-outline-color", fillColor);
          }
        } else if (type === "line") {
          if (id.includes("waterway")) {
            map.setPaintProperty(id, "line-color", "#3f5a6d");
          } else if (id.includes("boundary")) {
            map.setPaintProperty(id, "line-color", "#676772");
          } else {
            map.setPaintProperty(id, "line-color", "#1c1f26");
          }
        } else if (type === "symbol") {
          if (layer.paint && layer.paint["text-color"] !== undefined) {
            map.setPaintProperty(id, "text-color", "#c9c9c9");
          }
          if (layer.paint && layer.paint["text-halo-color"] !== undefined) {
            map.setPaintProperty(id, "text-halo-color", "#0e0e0e");
          }
        }
      } catch (err) {
        // Vissa lager saknar egenskapen — hoppa bara över.
      }
    }
  }

  // ---- Samma lila Skåne-järnvägshöjdning som huvudsidan (harmless bonus om
  // det finns spår i vy, annars gör den helt enkelt ingenting) ----
  const SKANE_BOUNDS_POLYGON = {
    type: "Polygon",
    coordinates: [[
      [12.65, 55.25], [14.65, 55.25], [14.65, 56.55], [12.65, 56.55], [12.65, 55.25],
    ]],
  };
  function highlightSkaneRailLines() {
    const style = map.getStyle();
    for (const layer of style.layers) {
      if (layer.type !== "line" || !layer.id.includes("rail")) continue;
      if (layer.id.endsWith("-skane")) continue;
      const highlightId = `${layer.id}-skane`;
      if (map.getLayer(highlightId)) continue;
      const geoFilter = ["within", SKANE_BOUNDS_POLYGON];
      const combinedFilter = layer.filter ? ["all", layer.filter, geoFilter] : geoFilter;
      try {
        map.addLayer({
          id: highlightId,
          type: "line",
          source: layer.source,
          ...(layer["source-layer"] ? { "source-layer": layer["source-layer"] } : {}),
          layout: layer.layout || {},
          filter: combinedFilter,
          paint: {
            "line-color": "#8a7fd6",
            "line-width": layer.id.includes("hatching") ? 5 : 3.5,
          },
        });
      } catch (err) {
        // Ofarligt om det misslyckas — rent kosmetiskt.
      }
    }
  }

  // ============================================================
  // Simulerade fordon — rör sig längs RIKTIGA gator, hämtade direkt
  // från kartans egna (redan laddade) väggeometri, i stället för
  // gissade koordinater. Inget extra API-anrop, ingen GPS — bara
  // kartans egen vektordata återanvänd.
  // ============================================================
  const FAKE_VEHICLE_STYLE = [
    { color: "2e7d32", label: "5" },
    { color: "f9a825", label: "171" },
    { color: "2e7d32", label: "8" },
    { color: "2e7d32", label: "3" },
    { color: "f9a825", label: "146" },
  ];

  function makeFakeIcon(color, label) {
    return `<div class="vehicle-icon" style="background:#${color};"><span class="label">${label}</span></div>`;
  }

  // Plockar ut några riktiga gatusträckor (LineString-geometrier) från de
  // väglager kartan redan ritat upp i den synliga vyn.
  function findRealRoadRoutes(count) {
    const features = map.queryRenderedFeatures();
    const seen = new Set();
    const candidates = [];
    const layerIdsLogged = new Set();

    function isValidCoord(c) {
      return Array.isArray(c) && c.length >= 2 && Number.isFinite(c[0]) && Number.isFinite(c[1]);
    }

    for (const f of features) {
      const layerId = f.layer && f.layer.id ? f.layer.id : "";
      layerIdsLogged.add(`${layerId} (${f.geometry.type})`);
      if (f.geometry.type !== "LineString") continue;
      if (
        layerId.includes("rail") ||
        layerId.includes("water") ||
        layerId.includes("boundary") ||
        layerId.includes("building") ||
        layerId.includes("label") ||
        layerId.includes("shield") ||
        layerId.includes("arrow") ||
        layerId.includes("aeroway")
      ) continue;
      const coords = f.geometry.coordinates;
      // Kräv att ALLA punkter i sträckan faktiskt är giltiga [lng, lat]-par
      // — trasiga/ofullständiga koordinater var trolig orsak till kraschen.
      if (!Array.isArray(coords) || coords.length < 2 || !coords.every(isValidCoord)) continue;
      const key = coords[0].join(",") + coords[coords.length - 1].join(",");
      if (seen.has(key)) continue;
      seen.add(key);
      candidates.push(coords);
    }
    console.log("Alla lager som hittades i vyn:", [...layerIdsLogged]);
    // Blanda och plocka ut det antal vi behöver.
    for (let i = candidates.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [candidates[i], candidates[j]] = [candidates[j], candidates[i]];
    }
    return candidates.slice(0, count);
  }

  function startFakeVehicles() {
    const pool = findRealRoadRoutes(24); // en större pool att välja nya gator ifrån
    console.log(`Hittade ${pool.length} riktiga gatusträckor att simulera fordon på.`);
    if (pool.length === 0) {
      console.warn("Hittade inga riktiga gator att simulera fordon på ännu.");
      return;
    }

    function randomRoute() {
      return pool[Math.floor(Math.random() * pool.length)];
    }

    // Extra skyddsnät: anropa aldrig setLngLat med ett ogiltigt värde,
    // även om det inte borde kunna hända efter valideringen ovan.
    function safeSetLngLat(marker, coord) {
      if (Array.isArray(coord) && Number.isFinite(coord[0]) && Number.isFinite(coord[1])) {
        marker.setLngLat(coord);
      }
    }

    FAKE_VEHICLE_STYLE.forEach((style) => {
      const el = document.createElement("div");
      el.className = "vehicle-marker";
      el.innerHTML = makeFakeIcon(style.color, style.label);
      const tickMs = 2400 + Math.random() * 600;
      el.style.transitionProperty = "transform";
      el.style.transitionDuration = `${tickMs}ms`;
      // Räkna ut startpositionen FÖRST, sätt den direkt vid skapandet — att
      // lägga till markören på kartan innan den har en position alls var
      // orsaken till kraschen.
      let route = randomRoute();
      let step = Math.floor(Math.random() * (route.length - 1));
      console.log(`Skapade fordonsmarkör "${style.label}" vid`, route[step]);
      const marker = new maplibregl.Marker({ element: el, anchor: "center" })
        .setLngLat(route[step])
        .addTo(map);

      const tick = () => {
        step++;
        if (step >= route.length) {
          // Vägens slut nådd — "kör av skärmen": tona ut, hoppa osynligt
          // till en ny slumpad gata, tona in igen. Aldrig en U-sväng.
          el.style.transitionProperty = "opacity";
          el.style.transitionDuration = "0.4s";
          el.style.opacity = "0";
          setTimeout(() => {
            route = randomRoute();
            step = 0;
            el.style.transitionProperty = "transform";
            el.style.transitionDuration = "0s";
            safeSetLngLat(marker, route[step]);
            // Nästa frame: sätt tillbaka normal glidning och tona in.
            requestAnimationFrame(() => {
              requestAnimationFrame(() => {
                el.style.transitionProperty = "transform, opacity";
                el.style.transitionDuration = `${tickMs}ms, 0.4s`;
                el.style.opacity = "1";
              });
            });
          }, 400);
          return;
        }
        safeSetLngLat(marker, route[step]);
      };
      setInterval(tick, tickMs);
    });
  }

  // "idle" (inte "load") — vi vill vara säkra på att kakelrutorna med
  // väggeometrin faktiskt hunnit ritas innan vi frågar efter dem.
  map.on("load", () => {
    applyDarkTheme();
    removeUnneededLayers();
    highlightSkaneRailLines();
  });
  map.once("idle", () => {
    startFakeVehicles();
  });
</script>
</body>
</html>
