<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kontakt – Skåne Live</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<style>
  :root {
    --bg: #0e0e0e;
    --panel: #0d0d0d;
    --fg: #e7ece8;
    --muted: #7d9088;
    --line: #262626;
    --accent: #ff8552;
    --accent-dim: #c9612f;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    background: var(--bg);
    color: var(--fg);
    font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
    overflow: hidden;
  }
  body {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 1.5rem;
  }

  #bg-map {
    position: absolute;
    inset: 0;
    z-index: 0;
    pointer-events: none;
  }

  .place-labels-layer {
    filter: brightness(1.6);
  }
  .base-map-layer {
    filter: brightness(1.12);
  }

  .vehicle-marker {
    transition: transform 6.5s linear;
    will-change: transform;
  }
  .vehicle-icon {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 20px;
    height: 20px;
    border-radius: 50%;
    background: var(--panel);
    box-shadow: 0 1px 4px rgba(0,0,0,0.6);
    color: var(--fg);
    font-size: 9px;
    font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
    font-weight: 600;
    white-space: nowrap;
    overflow: hidden;
  }
  .vehicle-icon.unknown { background: var(--accent-dim); }
  .vehicle-icon .label {
    text-shadow:
      -1px -1px 0 #000,
       1px -1px 0 #000,
      -1px  1px 0 #000,
       1px  1px 0 #000;
  }

  #bg-overlay {
    position: absolute;
    inset: 0;
    z-index: 1;
    pointer-events: none;
    background:
      radial-gradient(ellipse at center,
        rgba(14, 14, 14, 0.50) 0%,
        rgba(14, 14, 14, 0.72) 55%,
        rgba(14, 14, 14, 0.88) 100%);
  }

  .contact-box {
    position: relative;
    z-index: 2;
    background: rgba(13, 13, 13, 0.62);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 2rem 2.4rem;
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    max-width: 90vw;
  }
  .contact-box p {
    margin: 0 0 0.7rem;
    line-height: 1.6;
    color: var(--muted);
    font-size: 0.95rem;
  }
  .email-row {
    display: inline-flex;
    align-items: center;
    gap: 0.7rem;
    font-size: 1.15rem;
    font-weight: 600;
    color: var(--fg);
  }
  #copy-btn {
    background: none;
    border: 1px solid var(--line);
    border-radius: 5px;
    padding: 0.4rem;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    color: var(--fg);
    transition: border-color 0.15s ease;
  }
  #copy-btn:hover {
    border-color: var(--muted);
  }
  #copy-feedback {
    display: block;
    margin-top: 0.8rem;
    font-size: 0.8rem;
    color: var(--muted);
    height: 1.2em;
    opacity: 0;
    transition: opacity 0.2s ease;
  }
  #copy-feedback.visible {
    opacity: 1;
  }
  .back-link {
    display: inline-block;
    margin-top: 1.8rem;
    color: var(--muted);
    text-decoration: none;
    font-size: 0.85rem;
    transition: color 0.15s ease;
  }
  .back-link:hover {
    color: var(--fg);
  }
</style>
</head>
<body>
  <div id="bg-map" aria-hidden="true"></div>
  <div id="bg-overlay" aria-hidden="true"></div>

  <div class="contact-box">
    <p>För kontakt använd min mejl</p>
    <div class="email-row">
      <span id="email-text">sebastianmauritsson@gmail.com</span>
      <button id="copy-btn" aria-label="Kopiera mejladress" title="Kopiera">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="9" y="9" width="12" height="12" rx="2"></rect>
          <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
        </svg>
      </button>
    </div>
    <span id="copy-feedback">Kopierat!</span>
    <br>
    <a class="back-link" href="index.html">← Tillbaka till kartan</a>
  </div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/protobufjs@7.2.6/dist/protobuf.min.js"></script>
<script>
  // ============================================================
  // Kopiera-knapp
  // ============================================================
  const copyBtn = document.getElementById("copy-btn");
  const feedback = document.getElementById("copy-feedback");
  const email = document.getElementById("email-text").textContent;

  copyBtn.addEventListener("click", async () => {
    try {
      await navigator.clipboard.writeText(email);
    } catch (err) {
      const ta = document.createElement("textarea");
      ta.value = email;
      document.body.appendChild(ta);
      ta.select();
      document.execCommand("copy");
      document.body.removeChild(ta);
    }
    feedback.classList.add("visible");
    setTimeout(() => feedback.classList.remove("visible"), 1500);
  });

  // ============================================================
  // Konfiguration (samma som huvudsidan)
  // ============================================================
  const PROXY_URL = "https://skanetrafikenlivekarta.sebastianmauritsson.workers.dev";
  const TRIP_LOOKUP_URL = "data/trip_lookup.json";
  const CARTO_API_KEY = "cb1_2xg9_1_343477973a1876e2e80c6005";
  const POLL_INTERVAL_MS = 7000;

  // ============================================================
  // Minimal GTFS-Realtime protobuf-schema
  // ============================================================
  const GTFS_RT_PROTO = `
syntax = "proto2";
package transit_realtime;

message FeedMessage {
  required FeedHeader header = 1;
  repeated FeedEntity entity = 2;
}
message FeedHeader {
  required string gtfs_realtime_version = 1;
  optional uint64 timestamp = 3;
}
message FeedEntity {
  required string id = 1;
  optional VehiclePosition vehicle = 4;
}
message VehiclePosition {
  optional TripDescriptor trip = 1;
  optional VehicleDescriptor vehicle = 8;
  optional Position position = 2;
  optional uint64 timestamp = 5;
}
message TripDescriptor {
  optional string trip_id = 1;
  optional string route_id = 5;
}
message VehicleDescriptor {
  optional string id = 1;
  optional string label = 2;
}
message Position {
  required float latitude = 1;
  required float longitude = 2;
  optional float bearing = 3;
  optional float speed = 5;
}
`;

  // ============================================================
  // Karta – samma Carto Dark Matter som live-kartan
  // Inzoomad på centrala Malmö
  // ============================================================
  const map = L.map("bg-map", {
    center: [55.5935, 13.0130],   // Möllevången
    zoom: 15.2,
    zoomControl: false,
    attributionControl: false,
    dragging: false,
    scrollWheelZoom: false,
    doubleClickZoom: false,
    boxZoom: false,
    keyboard: false,
    touchZoom: false,
  });

  L.tileLayer(
    `https://{s}.basemaps.cartocdn.com/rastertiles/dark_nolabels/{z}/{x}/{y}{r}.png?key=${CARTO_API_KEY}`,
    { maxZoom: 20, className: "base-map-layer" }
  ).addTo(map);

  L.tileLayer(
    `https://{s}.basemaps.cartocdn.com/rastertiles/dark_only_labels/{z}/{x}/{y}{r}.png?key=${CARTO_API_KEY}`,
    { maxZoom: 20, className: "place-labels-layer" }
  ).addTo(map);

  // ============================================================
  // Fordonsmarkörer (live)
  // ============================================================
  const markers = new Map();
  const tripInfoByTripId = new Map();
  let staticDataLoaded = false;
  let FeedMessageType = null;

  function iconHtml(tripInfo) {
    const hasColor = tripInfo && tripInfo.color;
    const bg = hasColor ? `#${tripInfo.color}` : null;
    const fg = tripInfo && tripInfo.textColor ? `#${tripInfo.textColor}` : "#eef1ec";
    const label = tripInfo && tripInfo.line ? tripInfo.line : "";
    const style = `${bg ? `background:${bg};color:${fg};` : ""}`;
    const cls = hasColor ? "" : "unknown";
    const labelHtml = label ? `<span class="label">${label}</span>` : "";
    return `<div class="vehicle-icon ${cls}" style="${style}">${labelHtml}</div>`;
  }

  function makeDivIcon(tripInfo) {
    return L.divIcon({
      className: "vehicle-marker",
      html: iconHtml(tripInfo),
      iconSize: [20, 20],
      iconAnchor: [10, 10],
    });
  }

  function updateVehicles(entities) {
    const seenIds = new Set();

    for (const entity of entities) {
      const vp = entity.vehicle;
      if (!vp || !vp.position) continue;

      const id = (vp.vehicle && (vp.vehicle.id || vp.vehicle.label)) || entity.id;
      const lat = vp.position.latitude;
      const lon = vp.position.longitude;
      const tripId = vp.trip && vp.trip.tripId ? vp.trip.tripId : "";
      const tripInfo = tripInfoByTripId.get(tripId);
      const displayName = (tripInfo && tripInfo.line) || tripId || "okänd";

      if (staticDataLoaded && displayName === "okänd") continue;

      seenIds.add(id);

      if (markers.has(id)) {
        const entry = markers.get(id);
        entry.marker.setLatLng([lat, lon]);
      } else {
        const marker = L.marker([lat, lon], {
          icon: makeDivIcon(tripInfo),
          interactive: false,
        }).addTo(map);
        markers.set(id, { marker, tripInfo });
      }
    }

    for (const [id, entry] of markers.entries()) {
      if (!seenIds.has(id)) {
        map.removeLayer(entry.marker);
        markers.delete(id);
      }
    }
  }

  async function loadProtoSchema() {
    const root = protobuf.parse(GTFS_RT_PROTO).root;
    FeedMessageType = root.lookupType("transit_realtime.FeedMessage");
  }

  async function loadTripLookup() {
    try {
      const res = await fetch(TRIP_LOOKUP_URL, { cache: "no-store" });
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const data = await res.json();
      for (const [tripId, info] of Object.entries(data.trips)) {
        tripInfoByTripId.set(tripId, info);
      }
      staticDataLoaded = true;
      console.log(`Laddade ${tripInfoByTripId.size} resor för bakgrundskartan`);
    } catch (err) {
      console.warn("Kunde inte ladda trip_lookup:", err);
    }
  }

  async function fetchVehiclePositions() {
    const res = await fetch(PROXY_URL, { cache: "no-store" });
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const buffer = new Uint8Array(await res.arrayBuffer());
    const message = FeedMessageType.decode(buffer);
    const obj = FeedMessageType.toObject(message, { defaults: true });
    return obj.entity || [];
  }

  async function pollLoop() {
    try {
      const entities = await fetchVehiclePositions();
      updateVehicles(entities);
    } catch (err) {
      console.warn("Kunde inte hämta fordon:", err.message);
    } finally {
      setTimeout(pollLoop, POLL_INTERVAL_MS);
    }
  }

  (async function init() {
    await loadProtoSchema();
    loadTripLookup();
    pollLoop();
  })();
</script>
</body>
</html>
